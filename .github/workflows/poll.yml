name: Wallet Poller

on:
  schedule:
    # GitHub bazen yeni/az aktiviteli hesaplarda cron tetiklemesini sessizce
    # durduruyor; dosyaya push atmak zamanlayiciyi yeniden etkinlestiriyor.
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wallet-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLETS: ${{ secrets.WALLETS }}
          MIN_USDC_SIZE: ${{ secrets.MIN_USDC_SIZE }}
          PAPER_TRADING_WALLETS: ${{ secrets.PAPER_TRADING_WALLETS }}
          PAPER_START_BALANCE: ${{ secrets.PAPER_START_BALANCE }}
          MY_WALLET: ${{ secrets.MY_WALLET }}
          REMINDER_AFTER_MINUTES: ${{ secrets.REMINDER_AFTER_MINUTES }}
          MAX_SLIPPAGE_PCT: ${{ secrets.MAX_SLIPPAGE_PCT }}
          STATE_PATH: ./state.json
          PAPER_STATE_PATH: ./paper-portfolio.json
          RUN_ONCE: "1"
        run: node src/index.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json paper-portfolio.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "Durum guncelle [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi (cakisan calistirma olabilir), rebase ile tekrar deneniyor... ($i/5)"
            git fetch origin master
            git rebase origin/master
            sleep $((i * 2))
          done
          echo "5 denemeden sonra push basarisiz oldu."
          exit 1
